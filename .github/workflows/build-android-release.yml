name: PHATBOT Google Play AAB

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-android-release.yml'
      - '.github/workflows/build-android-apk.yml'
      - 'scripts/android/**'
      - 'android-native/**'
      - 'capacitor.config.ts'
      - 'ios-shell/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Android without release credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @capacitor/android@8.5.0 --no-audit --no-fund
      - name: Test release preparation and generate existing Android shell
        run: |
          node --test scripts/android/test-prepare.mjs
          npx cap add android
          npx cap sync android
          node scripts/android/prepare.mjs verify
          node scripts/android/prepare.mjs bridge
          node scripts/android/prepare.mjs compatibility
      - name: Validate debug Gradle path
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Configure and compile release without credentials
        run: |
          node scripts/android/prepare.mjs release
          cd android
          ./gradlew :app:compileReleaseKotlin :app:processReleaseMainManifest --no-daemon --console=plain
          ./gradlew :app:bundleRelease --dry-run --no-daemon --console=plain > "$RUNNER_TEMP/release-task-graph.txt"
          grep -q ':app:verifyPhatbotReleaseSigning' "$RUNNER_TEMP/release-task-graph.txt"
          grep -q ':app:bundleRelease' "$RUNNER_TEMP/release-task-graph.txt"
          cat "$RUNNER_TEMP/release-task-graph.txt"
      - name: Verify signing stage fails closed without credentials
        working-directory: android
        shell: bash
        run: |
          if ./gradlew :app:bundleRelease --no-daemon --console=plain > "$RUNNER_TEMP/missing-signing.txt" 2>&1; then
            echo 'ERROR: release signing unexpectedly accepted missing credentials'
            exit 1
          fi
          grep -q 'Missing Android release signing configuration' "$RUNNER_TEMP/missing-signing.txt"
          echo 'Release signing stage correctly rejects absent credentials; no release bundle uploaded.'

  release:
    name: Build signed Play upload bundle
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    concurrency:
      group: phatbot-android-play-release
      cancel-in-progress: false
    steps:
      - name: Check out exact selected workflow ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require upload signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing required secret: $name (android-release environment)"; exit 1; fi
          done
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then echo '::error::Start a NEW workflow run, not a rerun, for a fresh versionCode.'; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @capacitor/android@8.5.0 --no-audit --no-fund
      - name: Generate and validate production shell, preserve Health Connect
        run: |
          npx cap add android
          npx cap sync android
          node scripts/android/prepare.mjs verify
          node scripts/android/prepare.mjs bridge
          node scripts/android/prepare.mjs compatibility
      - name: Assign Play version and release signing configuration
        id: version
        run: node scripts/android/prepare.mjs release
      - name: Reconstruct runner-only upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: node scripts/android/restore-keystore.mjs
      - name: Build and verify signed AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/phatbot-upload.jks"
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --no-configuration-cache --console=plain
          bundle='app/build/outputs/bundle/release/app-release.aab'
          test -s "$bundle"
          jarsigner -verify -strict -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD "$bundle" "$ANDROID_KEY_ALIAS"
          mkdir -p ../build/android
          cp "$bundle" "../build/android/PHATBOT-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.aab"
      - name: Remove temporary upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/phatbot-upload.jks"
      - name: Upload signed bundle only
        uses: actions/upload-artifact@v4
        with:
          name: PHATBOT-Play-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: build/android/PHATBOT-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.aab
          if-no-files-found: error
          retention-days: 14
