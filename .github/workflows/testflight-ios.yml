name: Build PHATBOT for TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26

    env:
      APPLE_TEAM_ID: S47LRBYFXA
      BUNDLE_ID: com.nextleveldigitalmedia.phatbot
      APP_VERSION: 1.0

    steps:
      - name: Check out HealthKit build branch
        uses: actions/checkout@v4
        with:
          ref: feature/healthkit-clean

      - name: Verify Xcode and iOS SDK versions
        shell: bash
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "App Store Connect requires the iOS 26 SDK or later."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor iOS project
        run: npm run ios:sync

      - name: Validate signing and App Store Connect secrets
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
          DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ENCRYPTED_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ENCRYPTED_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$ASC_KEY_ID" || { echo "Missing APP_STORE_CONNECT_KEY_ID secret"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "Missing APP_STORE_CONNECT_ISSUER_ID secret"; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo "Missing APP_STORE_CONNECT_PRIVATE_KEY secret"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "Missing IOS_SIGNING_KEY_PASSWORD secret"; exit 1; }
          test -n "$DISTRIBUTION_CERT_BASE64" || { echo "Missing IOS_DISTRIBUTION_CERTIFICATE_BASE64 secret"; exit 1; }
          test -n "$PROVISIONING_PROFILE_BASE64" || { echo "Missing IOS_PROVISIONING_PROFILE_BASE64 secret"; exit 1; }
          test -n "$ENCRYPTED_PRIVATE_KEY_BASE64" || { echo "Missing IOS_ENCRYPTED_PRIVATE_KEY_BASE64 secret"; exit 1; }

      - name: Install App Store Connect private key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install Apple Distribution certificate and provisioning profile
        id: signing
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
          DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ENCRYPTED_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ENCRYPTED_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p build/signing
          printf '%s' "$DISTRIBUTION_CERT_BASE64" | base64 --decode > build/signing/distribution.cer
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > build/signing/profile.mobileprovision
          printf '%s' "$ENCRYPTED_PRIVATE_KEY_BASE64" | base64 --decode > build/signing/private-key.pem.enc

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in build/signing/private-key.pem.enc \
            -out build/signing/private-key.pem \
            -pass env:SIGNING_PASSWORD

          openssl x509 -inform DER \
            -in build/signing/distribution.cer \
            -out build/signing/distribution.pem

          openssl pkcs12 -export \
            -inkey build/signing/private-key.pem \
            -in build/signing/distribution.pem \
            -out build/signing/distribution.p12 \
            -passout env:SIGNING_PASSWORD

          KEYCHAIN_PATH="$RUNNER_TEMP/phatbot-signing.keychain-db"
          security create-keychain -p "$SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security import build/signing/distribution.p12 \
            -P "$SIGNING_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i build/signing/profile.mobileprovision > build/signing/profile.plist
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' build/signing/profile.plist)"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' build/signing/profile.plist)"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' build/signing/profile.plist)"

          echo "Provisioning profile: $PROFILE_NAME"
          echo "Provisioning app id: $PROFILE_APP_ID"
          [[ "$PROFILE_APP_ID" == "$APPLE_TEAM_ID.$BUNDLE_ID" ]] || { echo "Provisioning profile does not match PHATBOT bundle ID"; exit 1; }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp build/signing/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Archive PHATBOT with manual App Store signing
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PHATBOT.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Export signed IPA for App Store Connect
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/PHATBOT.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist"

      - name: Locate IPA
        id: ipa
        shell: bash
        run: |
          IPA_PATH="$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || { echo "No IPA was exported"; exit 1; }
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "Exported: $IPA_PATH"

      - name: Validate upload with Apple
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect / TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
