name: Build PHATBOT Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected PHATBOT branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify production mobile shell
        shell: bash
        run: |
          echo "Workflow ref: $GITHUB_REF"
          echo "Checked out commit: $(git rev-parse HEAD)"
          grep -q "https://app.phatbotfit.com" capacitor.config.ts || { echo "Expected branded production PHATBOT URL is missing"; exit 1; }
          test -f ios-shell/index.html || { echo "Missing Capacitor webDir fallback"; exit 1; }
          test -f android-native/HealthConnectPlugin.kt || { echo "Missing Health Connect native bridge"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install --no-save @capacitor/android@8.5.0

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Install Health Connect native bridge
        run: node scripts/android/prepare.mjs bridge

      - name: Apply Health Connect SDK compatibility
        run: node scripts/android/prepare.mjs compatibility

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Validate merged Health Connect manifest requirements
        run: python3 scripts/android/validate-manifest.py debug

      - name: Prepare PHATBOT APK
        run: |
          mkdir -p build/android
          cp android/app/build/outputs/apk/debug/app-debug.apk "build/android/PHATBOT-beta-${GITHUB_RUN_NUMBER}.apk"
          ls -lh build/android/*.apk

      - name: Upload PHATBOT APK
        uses: actions/upload-artifact@v4
        with:
          name: PHATBOT-Android-Beta-${{ github.run_number }}
          path: build/android/PHATBOT-beta-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
