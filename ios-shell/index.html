<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>PHATBOT</title>
    <style>
      html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;}
      main{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;box-sizing:border-box;}
      .eyebrow{color:#ff0032;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;}
      h1{font-size:32px;margin:12px 0;}
      p{color:#b3b3b3;line-height:1.6;max-width:420px;}
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="eyebrow">PHATBOT</div>
        <h1>Connecting to your training data...</h1>
        <p>PHATBOT needs an internet connection to load your workouts, history, coaching signals, and reports.</p>
      </div>
    </main>
  </body>
</html>
